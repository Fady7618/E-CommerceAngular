<div class="row justify-content-between mt-5 align-items-center">
  <div class="col-lg-5 px-md-5 col-12">
    <h2>Log in to Exclusive</h2>
    
    <!-- Your existing form -->
    <form [formGroup]="loginForm" (ngSubmit)="handleSubmit()">
      <!-- Email field -->
      <div class="form-group position-relative">
        <input 
          type="email" 
          class="auth_input my-3" 
          placeholder="Email" 
          formControlName="email"
          [ngClass]="{'is-invalid': isSubmitted && loginForm.controls['email'].invalid}">
        <div class="text-danger validation-messages" *ngIf="isSubmitted && loginForm.controls['email'].invalid">
          <div *ngIf="loginForm.controls['email'].errors?.['required']">
            Email is required
          </div>
          <div *ngIf="loginForm.controls['email'].errors?.['email'] || loginForm.controls['email'].errors?.['pattern']">
            Please enter a valid email address
          </div>
        </div>
      </div>

      <!-- Password field -->
      <div class="form-group position-relative">
        <input 
          type="password"
          class="auth_input my-3" 
          placeholder="Password" 
          formControlName="password"
          [ngClass]="{'is-invalid': isSubmitted && loginForm.controls['password'].invalid}">
        <div class="text-danger validation-messages" *ngIf="isSubmitted && loginForm.controls['password'].invalid">
          <div *ngIf="loginForm.controls['password'].errors?.['required']">
            Password is required
          </div>
          <div *ngIf="loginForm.controls['password'].errors?.['minlength']">
            Password must be at least 8 characters long
          </div>
          <div *ngIf="loginForm.controls['password'].errors?.['pattern']">
            Password must contain at least one uppercase letter, one lowercase letter, and one number
          </div>
        </div>
      </div>

      <div class="d-flex justify-content-start">
        <a routerLink="/forgot-password">Forgot Password?</a>
      </div>

      <!-- Login Buttons Section - Side by Side -->
      <div class="mt-3">
        <div class="row gx-3">
          <div class="col-6">
            <button type="submit" class="btn btn-danger w-100 py-2 fw-medium">
              <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
              Log In
            </button>
          </div>
          <div class="col-6">
            <button type="button" class="btn bg-transparent btn-outline-dark w-100 py-2 d-flex justify-content-center align-items-center text-dark" (click)="loginWithGoogle()">
              <img src="/images/google.png" alt="Google" class="me-2" width="18" height="18">
              Google
            </button>
          </div>
        </div>
      </div>
    </form>
    <div class="d-flex mt-3 justify-content-center" style="gap: 10px;">
      <p>Don't have account?</p>
      <a routerLink="/signup" class="text-black">Sign Up</a>
    </div>
  </div>

  <div class="col-lg-7">
    <div class="img">
      <img src="/images/cart.png" alt="">
    </div>
  </div>
</div>
